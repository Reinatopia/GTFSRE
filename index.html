<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World of Vira</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#111;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(#83d8ff 0%,#b9ecff 55%,#75c95b 55%,#4d9b3f 100%);
}

/* Matahari */
#sun{
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    background:#fff2a8;
    right:10%;
    top:8%;
    box-shadow:0 0 40px #fff5a8;
}

/* Dunia */
#world{
    position:absolute;
    width:1600px;
    height:900px;
    left:0;
    top:0;
}

/* tanah */
#ground{
    position:absolute;
    left:0;
    top:500px;
    width:1600px;
    height:400px;
    background:
        repeating-linear-gradient(
            45deg,
            #63ad4c 0px,
            #63ad4c 35px,
            #5ca247 35px,
            #5ca247 70px
        );
}

/* Jalan */
.road{
    position:absolute;
    background:#c8a878;
    border-radius:30px;
}

.road1{
    left:0;
    top:650px;
    width:1600px;
    height:100px;
}

.road2{
    left:720px;
    top:500px;
    width:120px;
    height:400px;
}

/* Rumah */
.house{
    position:absolute;
    width:180px;
    height:130px;
    background:#f3d19a;
    border:5px solid #754c32;
}

.house:before{
    content:"";
    position:absolute;
    left:-20px;
    top:-80px;
    width:210px;
    height:100px;
    background:#9d4b54;
    border:5px solid #64323a;
    transform:skewX(-25deg);
}

.door{
    position:absolute;
    width:40px;
    height:70px;
    bottom:0;
    left:70px;
    background:#754c32;
}

/* Pohon */
.tree{
    position:absolute;
    width:35px;
    height:100px;
    background:#75452d;
}

.tree:before{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    background:#317c43;
    border-radius:50%;
    left:-38px;
    top:-80px;
    box-shadow:
        40px -20px 0 #3d914b,
        70px 15px 0 #2e713c;
}

/* Karakter */
.character{
    position:absolute;
    width:55px;
    height:80px;
    z-index:20;
    transition:transform .08s;
}

.head{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ffd2b3;
    left:5px;
    top:0;
}

.body{
    position:absolute;
    width:42px;
    height:35px;
    background:#a56cff;
    left:7px;
    top:42px;
    border-radius:10px 10px 5px 5px;
}

.eye{
    position:absolute;
    width:5px;
    height:7px;
    background:#222;
    border-radius:50%;
    top:18px;
}

.eye1{left:15px}
.eye2{right:15px}

.name{
    position:absolute;
    top:-25px;
    width:100px;
    left:-22px;
    text-align:center;
    color:white;
    font-weight:bold;
    font-size:13px;
    text-shadow:1px 1px 3px #000;
}

/* NPC */
.npc{
    position:absolute;
    width:55px;
    height:80px;
    z-index:15;
}

.npc .head{
    background:#ffe0c4;
}

.npc .body{
    background:#6f87ff;
}

/* Dewi */
.goddess{
    position:absolute;
    width:65px;
    height:95px;
    z-index:15;
}

.goddess .head{
    width:50px;
    height:50px;
    left:7px;
}

.goddess .body{
    width:55px;
    height:48px;
    left:5px;
    top:47px;
}

.moon .body{background:#b993ff}
.death .body{background:#555}
.destiny .body{background:#ff77c8}

/* UI */
#ui{
    position:fixed;
    top:15px;
    left:15px;
    z-index:100;
    color:white;
}

#title{
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}

#quest{
    margin-top:8px;
    padding:10px 14px;
    background:rgba(0,0,0,.55);
    border-radius:10px;
    font-size:14px;
}

#dialog{
    display:none;
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:min(90%,600px);
    background:rgba(20,15,35,.94);
    border:2px solid #d8b5ff;
    border-radius:15px;
    padding:18px;
    color:white;
    z-index:200;
}

#speaker{
    color:#d6adff;
    font-weight:bold;
    margin-bottom:8px;
}

#dialogText{
    line-height:1.5;
}

#hint{
    position:fixed;
    bottom:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,.5);
    padding:8px 12px;
    border-radius:8px;
    z-index:100;
    font-size:13px;
}

/* joystick */
#controls{
    position:fixed;
    right:15px;
    bottom:20px;
    z-index:100;
    display:grid;
    grid-template-columns:60px 60px 60px;
    grid-template-rows:60px 60px;
    gap:5px;
}

.btn{
    background:rgba(0,0,0,.5);
    color:white;
    border:2px solid rgba(255,255,255,.5);
    border-radius:15px;
    font-size:25px;
}

.up{grid-column:2}
.left{grid-column:1}
.down{grid-column:2}
.right{grid-column:3}
</style>
</head>

<body>

<div id="game">

<div id="world">

<div id="sun"></div>

<div id="ground"></div>

<div class="road road1"></div>
<div class="road road2"></div>

<div class="house" style="left:180px;top:410px;">
    <div class="door"></div>
</div>

<div class="house" style="left:1200px;top:410px;">
    <div class="door"></div>
</div>

<!-- Pohon -->
<div class="tree" style="left:100px;top:480px;"></div>
<div class="tree" style="left:400px;top:450px;"></div>
<div class="tree" style="left:1050px;top:460px;"></div>
<div class="tree" style="left:1450px;top:450px;"></div>

<!-- Vira -->
<div id="player" class="character" style="left:760px;top:650px;">
    <div class="name">Vira</div>
    <div class="head">
        <div class="eye eye1"></div>
        <div class="eye eye2"></div>
    </div>
    <div class="body"></div>
</div>

<!-- Goddess Moon -->
<div id="moon" class="goddess moon" style="left:500px;top:600px;">
    <div class="name">Goddess Moon</div>
    <div class="head"></div>
    <div class="body"></div>
</div>

<!-- Goddess Death -->
<div id="death" class="goddess death" style="left:1030px;top:600px;">
    <div class="name">Goddess Death</div>
    <div class="head"></div>
    <div class="body"></div>
</div>

<!-- Goddess Destiny -->
<div id="destiny" class="goddess destiny" style="left:760px;top:390px;">
    <div class="name">Goddess Destiny</div>
    <div class="head"></div>
    <div class="body"></div>
</div>

</div>

<div id="ui">
    <div id="title">🌌 WORLD OF VIRA</div>
    <div id="quest">
        Quest: Temui para Dewi
    </div>
</div>

<div id="dialog">
    <div id="speaker"></div>
    <div id="dialogText"></div>
</div>

<div id="hint">
    WASD / Arrow = Bergerak • Dekati karakter untuk berbicara
</div>

<div id="controls">
    <button class="btn up" data-key="ArrowUp">▲</button>
    <button class="btn left" data-key="ArrowLeft">◀</button>
    <button class="btn down" data-key="ArrowDown">▼</button>
    <button class="btn right" data-key="ArrowRight">▶</button>
</div>

</div>

<script>

const player = document.getElementById("player");
const world = document.getElementById("world");
const dialog = document.getElementById("dialog");
const speaker = document.getElementById("speaker");
const dialogText = document.getElementById("dialogText");
const quest = document.getElementById("quest");

let x = 760;
let y = 650;
let speed = 5;

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

document.querySelectorAll(".btn").forEach(btn => {

    const key = btn.dataset.key;

    btn.addEventListener("touchstart", e => {
        e.preventDefault();
        keys[key] = true;
    });

    btn.addEventListener("touchend", e => {
        e.preventDefault();
        keys[key] = false;
    });

    btn.addEventListener("mousedown", () => {
        keys[key] = true;
    });

    btn.addEventListener("mouseup", () => {
        keys[key] = false;
    });
});


const gods = [
    {
        id:"moon",
        name:"Goddess Moon",
        x:500,
        y:600,
        text:"Vira... akhirnya kau datang. Bulan telah melihat sesuatu yang aneh di langit malam."
    },
    {
        id:"death",
        name:"Goddess Death",
        x:1030,
        y:600,
        text:"Jangan takut, Vira. Kematian hanyalah gerbang menuju sesuatu yang belum kau pahami."
    },
    {
        id:"destiny",
        name:"Goddess Destiny",
        x:760,
        y:390,
        text:"Takdir para manusia sedang berubah. Bahkan para dewa tidak dapat melihat akhir dari perjalanan ini."
    }
];


function distance(a,b,c,d){
    return Math.sqrt(
        Math.pow(a-c,2) +
        Math.pow(b-d,2)
    );
}


function talk(){

    let closest = null;
    let closestDistance = 9999;

    gods.forEach(god => {

        let d = distance(x,y,god.x,god.y);

        if(d < closestDistance){
            closestDistance = d;
            closest = god;
        }

    });

    if(closest && closestDistance < 100){

        speaker.innerText = closest.name;
        dialogText.innerText = closest.text;
        dialog.style.display = "block";

        quest.innerText =
            "Quest: " +
            closest.name +
            " telah ditemui ✓";

        setTimeout(() => {
            dialog.style.display = "none";
        },5000);
    }
}


function update(){

    let moved = false;

    if(keys["ArrowUp"] || keys["w"] || keys["W"]){
        y -= speed;
        moved = true;
    }

    if(keys["ArrowDown"] || keys["s"] || keys["S"]){
        y += speed;
        moved = true;
    }

    if(keys["ArrowLeft"] || keys["a"] || keys["A"]){
        x -= speed;
        moved = true;
    }

    if(keys["ArrowRight"] || keys["d"] || keys["D"]){
        x += speed;
        moved = true;
    }

    /* Batas dunia */
    x = Math.max(0,Math.min(1540,x));
    y = Math.max(350,Math.min(800,y));

    player.style.left = x + "px";
    player.style.top = y + "px";

    /* Kamera mengikuti Vira */
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    let cameraX = screenWidth / 2 - x - 27;
    let cameraY = screenHeight / 2 - y - 40;

    cameraX = Math.min(0,Math.max(screenWidth-1600,cameraX));
    cameraY = Math.min(0,Math.max(screenHeight-900,cameraY));

    world.style.transform =
        `translate(${cameraX}px,${cameraY}px)`;

    if(moved){
        player.style.transform =
            "scaleX(" +
            ((keys["ArrowLeft"] || keys["a"] || keys["A"]) ? -1 : 1)
            + ")";
    }

    talk();

    requestAnimationFrame(update);
}

update();

</script>

</body>
  </html>
