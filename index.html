<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>World of Vira</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#75cfff 0 48%,#69b957 48% 100%)}
#world{position:absolute;width:1800px;height:1000px}
#ground{position:absolute;left:0;top:480px;width:1800px;height:520px;background:
radial-gradient(circle at 20% 20%,#8ad06b 0 5px,transparent 6px),
radial-gradient(circle at 70% 70%,#4e9c48 0 4px,transparent 5px),#65ad50}
.road{position:absolute;background:#c9ad80;border:4px solid #b49369;border-radius:40px}
.r1{left:0;top:690px;width:1800px;height:110px}
.r2{left:845px;top:480px;width:110px;height:520px}
.house{position:absolute;width:210px;height:145px;background:#f4d49f;border:6px solid #744b35;border-radius:5px}
.house:before{content:"";position:absolute;left:-24px;top:-90px;width:245px;height:105px;background:#a9525a;border:6px solid #68343c;transform:skewX(-25deg)}
.door{position:absolute;bottom:0;left:82px;width:46px;height:75px;background:#744b35}
.tree{position:absolute;width:34px;height:110px;background:#70432c}
.tree:before{content:"";position:absolute;left:-45px;top:-90px;width:125px;height:125px;border-radius:50%;background:#367f42;box-shadow:45px -20px 0 #438e4c,70px 20px 0 #2f713b}
.character,.god{position:absolute;z-index:10;transform-origin:center bottom}
.character img,.god img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 5px rgba(0,0,0,.25))}
#player{width:95px;height:180px}
.god{width:150px;height:230px}
#destiny{left:775px;top:250px}
#moon{left:470px;top:565px}
#finality{left:1120px;top:535px}
#death{left:805px;top:575px}
#player{left:810px;top:650px}
.name{position:absolute;top:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 9px;border-radius:10px;background:rgba(20,10,35,.72);color:#fff;font-weight:bold;font-size:13px}
#ui{position:fixed;left:14px;top:14px;z-index:100;color:#fff;text-shadow:1px 2px 4px #000}
#title{font-size:23px;font-weight:bold}
#quest{margin-top:8px;background:rgba(0,0,0,.55);padding:10px 13px;border-radius:12px;font-size:14px}
#dialog{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(92%,650px);z-index:200;background:rgba(18,12,30,.96);border:2px solid #d7b0ff;border-radius:16px;padding:18px;color:#fff}
#speaker{color:#e0bfff;font-weight:bold;margin-bottom:7px}
#dialogText{line-height:1.5}
#close{margin-top:12px;border:0;border-radius:9px;padding:8px 15px;background:#8f5bd5;color:white}
#hint{position:fixed;left:10px;bottom:10px;z-index:100;color:white;background:rgba(0,0,0,.55);padding:8px 11px;border-radius:9px;font-size:12px}
#controls{position:fixed;right:12px;bottom:18px;z-index:100;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:5px}
.btn{border:2px solid rgba(255,255,255,.5);border-radius:15px;background:rgba(0,0,0,.5);color:#fff;font-size:24px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
</style>
</head>
<body>
<div id="game">
<div id="world">
<div id="ground"></div><div class="road r1"></div><div class="road r2"></div>
<div class="house" style="left:160px;top:390px"><div class="door"></div></div>
<div class="house" style="left:1420px;top:390px"><div class="door"></div></div>
<div class="tree" style="left:90px;top:480px"></div><div class="tree" style="left:360px;top:445px"></div>
<div class="tree" style="left:1260px;top:450px"></div><div class="tree" style="left:1660px;top:465px"></div>

<div id="destiny" class="god"><div class="name">Goddess Destiny</div><img src="assets/destiny.png"></div>
<div id="moon" class="god"><div class="name">Goddess Moon</div><img src="assets/moon.png"></div>
<div id="finality" class="god"><div class="name">Goddess Finality</div><img src="assets/finality.png"></div>
<div id="death" class="god"><div class="name">Goddess Death</div><img src="assets/death.png"></div>

<div id="player" class="character"><div class="name">Vira</div><img src="assets/vira.png"></div>
</div>

<div id="ui"><div id="title">🌌 WORLD OF VIRA</div><div id="quest">Quest: Temui para Dewi</div></div>
<div id="dialog"><div id="speaker"></div><div id="dialogText"></div><button id="close">Tutup</button></div>
<div id="hint">WASD / tombol panah = bergerak • Dekati dewi untuk bicara</div>
<div id="controls">
<button class="btn up" data-key="ArrowUp">▲</button>
<button class="btn left" data-key="ArrowLeft">◀</button>
<button class="btn down" data-key="ArrowDown">▼</button>
<button class="btn right" data-key="ArrowRight">▶</button>
</div>
</div>

<script>
const player=document.getElementById("player"),world=document.getElementById("world");
const dialog=document.getElementById("dialog"),speaker=document.getElementById("speaker"),dialogText=document.getElementById("dialogText"),quest=document.getElementById("quest");
let x=810,y=650,speed=5; const keys={};

addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll(".btn").forEach(b=>{
 const k=b.dataset.key;
 ["touchstart","mousedown"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=true}));
 ["touchend","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}));
});
document.getElementById("close").onclick=()=>dialog.style.display="none";

const gods=[
 {name:"Goddess Destiny",x:850,y:350,text:"Vira... takdir dunia ini mulai bergerak. Bahkan masa depan para dewa tidak lagi pasti."},
 {name:"Goddess Moon",x:545,y:650,text:"Aku menjaga cahaya malam. Tetapi akhir-akhir ini, ada sesuatu yang bersembunyi di balik bulan."},
 {name:"Goddess Finality",x:1190,y:620,text:"Segala sesuatu memiliki akhir. Namun dunia yang kau ciptakan belum menemukan akhirnya."},
 {name:"Goddess Death",x:850,y:650,text:"Jangan takut pada kematian. Yang harus kau takuti adalah sesuatu yang bahkan kematian tidak mampu mengambilnya."}
];

let met=new Set();
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function talk(){
 let near=null,md=999;
 gods.forEach(g=>{let d=dist(x,y,g.x,g.y);if(d<md){md=d;near=g}});
 if(near&&md<125){
   speaker.textContent=near.name;dialogText.textContent=near.text;dialog.style.display="block";
   met.add(near.name); quest.textContent=`Quest: ${met.size}/4 dewi telah ditemui`;
   if(met.size===4)quest.textContent="Quest selesai ✓ Semua dewi telah ditemui!";
 }
}
function loop(){
 if(keys.ArrowUp||keys.w||keys.W)y-=speed;
 if(keys.ArrowDown||keys.s||keys.S)y+=speed;
 if(keys.ArrowLeft||keys.a||keys.A)x-=speed;
 if(keys.ArrowRight||keys.d||keys.D)x+=speed;
 x=Math.max(20,Math.min(1720,x));y=Math.max(470,Math.min(820,y));
 player.style.left=x+"px";player.style.top=y+"px";
 const sw=innerWidth,sh=innerHeight;
 let cx=sw/2-x-47,cy=sh/2-y-90;
 cx=Math.min(0,Math.max(sw-1800,cx));cy=Math.min(0,Math.max(sh-1000,cy));
 world.style.transform=`translate(${cx}px,${cy}px)`;
 talk();requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
