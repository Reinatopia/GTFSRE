<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTFS WL Spaceman</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 50% 20%, #16245c 0%, #080b20 45%, #03040d 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
    background-size: 80px 80px, 130px 130px;
    background-position: 10px 20px, 50px 70px;
    opacity: .35;
    pointer-events: none;
}

.game {
    width: 95%;
    max-width: 480px;
    position: relative;
    z-index: 2;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
}

.balance {
    background: rgba(255,255,255,.08);
    padding: 10px 14px;
    border-radius: 12px;
    font-weight: bold;
}

.arena {
    height: 400px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    background:
        linear-gradient(180deg, rgba(25,36,90,.5), rgba(2,5,18,.8));
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.multiplier {
    position: absolute;
    top: 35%;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 58px;
    font-weight: 900;
    text-shadow: 0 0 25px #6f8cff;
}

.status {
    position: absolute;
    top: 51%;
    width: 100%;
    text-align: center;
    color: #aab4e8;
}

.rocket {
    position: absolute;
    font-size: 55px;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%) rotate(-25deg);
    filter: drop-shadow(0 0 15px #ffb347);
    transition: left .15s linear, bottom .15s linear;
}

.flame {
    position: absolute;
    font-size: 35px;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    opacity: .8;
}

.controls {
    margin-top: 14px;
    padding: 15px;
    background: rgba(255,255,255,.06);
    border-radius: 18px;
}

.bet-row {
    display: flex;
    gap: 10px;
}

input {
    width: 100%;
    padding: 14px;
    border: 0;
    outline: none;
    border-radius: 12px;
    background: #11162f;
    color: white;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px;
    font-weight: 900;
    cursor: pointer;
    color: white;
}

.bet {
    width: 100%;
    margin-top: 10px;
    background: linear-gradient(135deg,#5865f2,#7d5cff);
}

.cashout {
    width: 100%;
    margin-top: 10px;
    background: linear-gradient(135deg,#00a86b,#20d88b);
    display: none;
}

button:disabled {
    opacity: .4;
}

.quick {
    display: flex;
    gap: 7px;
    margin-top: 9px;
}

.quick button {
    flex: 1;
    background: #171d3b;
    font-size: 12px;
}

.history {
    margin-top: 14px;
    background: rgba(255,255,255,.05);
    padding: 12px;
    border-radius: 15px;
}

.history-title {
    color: #8993c4;
    font-size: 12px;
    margin-bottom: 8px;
}

.history-list {
    display: flex;
    gap: 7px;
    overflow-x: auto;
}

.history-item {
    background: #171d3b;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
    white-space: nowrap;
}

.green {
    color: #39e58c;
}

.red {
    color: #ff5964;
}

.footer {
    text-align: center;
    color: #68709a;
    font-size: 11px;
    margin-top: 12px;
}

.crash {
    animation: shake .35s infinite;
}

@keyframes shake {
    0% { transform: translateX(-50%) rotate(-25deg); }
    25% { transform: translateX(-55%) rotate(-22deg); }
    50% { transform: translateX(-45%) rotate(-28deg); }
    75% { transform: translateX(-55%) rotate(-25deg); }
    100% { transform: translateX(-50%) rotate(-25deg); }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="game">

    <div class="header">
        <div class="logo">🚀 GTFS SPACEMAN</div>
        <div class="balance">
            💎 <span id="balance">1000</span> WL
        </div>
    </div>

    <div class="arena">

        <div class="multiplier" id="multiplier">
            1.00x
        </div>

        <div class="status" id="status">
            Place your bet!
        </div>

        <div class="rocket" id="rocket">
            🚀
        </div>

        <div class="flame">
            🔥
        </div>

    </div>

    <div class="controls">

        <div class="bet-row">
            <input
                id="betAmount"
                type="number"
                min="1"
                value="10"
                placeholder="Jumlah WL">
        </div>

        <div class="quick">
            <button onclick="setBet(5)">5 WL</button>
            <button onclick="setBet(10)">10 WL</button>
            <button onclick="setBet(50)">50 WL</button>
            <button onclick="setBet(100)">100 WL</button>
        </div>

        <button class="bet" id="betButton" onclick="startGame()">
            🚀 START BET
        </button>

        <button class="cashout" id="cashoutButton" onclick="cashOut()">
            💰 CASH OUT
        </button>

    </div>

    <div class="history">

        <div class="history-title">
            LAST MULTIPLIERS
        </div>

        <div class="history-list" id="historyList">
            <div class="history-item green">2.45x</div>
            <div class="history-item red">1.12x</div>
            <div class="history-item green">5.73x</div>
            <div class="history-item green">3.21x</div>
        </div>

    </div>

    <div class="footer">
        GTFS Fun Game • Virtual WL only
    </div>

</div>

<script>

let balance = 1000;
let multiplier = 1;
let crashPoint = 0;
let bet = 0;
let running = false;
let gameTimer = null;

const balanceEl = document.getElementById("balance");
const multiplierEl = document.getElementById("multiplier");
const statusEl = document.getElementById("status");
const rocketEl = document.getElementById("rocket");
const betButton = document.getElementById("betButton");
const cashoutButton = document.getElementById("cashoutButton");
const betInput = document.getElementById("betAmount");
const historyList = document.getElementById("historyList");

function updateBalance() {
    balanceEl.textContent = balance.toLocaleString("id-ID");
}

function setBet(amount) {
    betInput.value = amount;
}

function randomCrash() {

    // Membuat crash point dengan mayoritas hasil
    // berada di multiplier rendah.
    let r = Math.random();

    if (r < 0.45) {
        return 1 + Math.random() * 0.8;
    }

    if (r < 0.75) {
        return 1.8 + Math.random() * 1.7;
    }

    if (r < 0.93) {
        return 3.5 + Math.random() * 4;
    }

    return 7 + Math.random() * 15;
}

function startGame() {

    if (running) return;

    bet = Number(betInput.value);

    if (!bet || bet <= 0) {
        alert("Masukkan jumlah WL!");
        return;
    }

    if (bet > balance) {
        alert("WL kamu tidak cukup!");
        return;
    }

    balance -= bet;
    updateBalance();

    multiplier = 1;
    crashPoint = randomCrash();
    running = true;

    multiplierEl.textContent = "1.00x";
    statusEl.textContent = "🚀 Rocket is flying...";
    
    betButton.style.display = "none";
    cashoutButton.style.display = "block";

    rocketEl.classList.remove("crash");

    let startTime = Date.now();

    gameTimer = setInterval(() => {

        let elapsed = (Date.now() - startTime) / 1000;

        multiplier = 1 + elapsed * 0.55 + Math.pow(elapsed, 1.35) * 0.12;

        multiplierEl.textContent =
            multiplier.toFixed(2) + "x";

        // Gerakan roket
        let height = Math.min(elapsed * 30, 280);
        let side = Math.sin(elapsed * 2) * 80;

        rocketEl.style.bottom = (35 + height) + "px";
        rocketEl.style.left =
            `calc(50% + ${side}px)`;

        if (multiplier >= crashPoint) {
            crash();
        }

    }, 50);
}

function cashOut() {

    if (!running) return;

    let win = Math.floor(bet * multiplier);

    balance += win;
    updateBalance();

    addHistory(multiplier, true);

    clearInterval(gameTimer);

    running = false;

    statusEl.textContent =
        "💰 CASH OUT +" + win + " WL";

    multiplierEl.classList.add("green");

    betButton.style.display = "block";
    cashoutButton.style.display = "none";

    setTimeout(() => {
        multiplierEl.classList.remove("green");
        resetRocket();
    }, 1200);
}

function crash() {

    clearInterval(gameTimer);

    running = false;

    multiplierEl.textContent =
        crashPoint.toFixed(2) + "x";

    multiplierEl.classList.remove("green");
    multiplierEl.classList.add("red");

    statusEl.textContent = "💥 CRASHED!";

    rocketEl.classList.add("crash");

    addHistory(crashPoint, false);

    betButton.style.display = "block";
    cashoutButton.style.display = "none";

    setTimeout(() => {

        multiplierEl.classList.remove("red");

        resetRocket();

    }, 1300);
}

function resetRocket() {

    rocketEl.classList.remove("crash");

    rocketEl.style.bottom = "35px";
    rocketEl.style.left = "50%";

    multiplier = 1;

    multiplierEl.textContent = "1.00x";

    statusEl.textContent = "Place your bet!";
}

function addHistory(value, won) {

    const item = document.createElement("div");

    item.className =
        "history-item " + (won ? "green" : "red");

    item.textContent =
        value.toFixed(2) + "x";

    historyList.prepend(item);

    while (historyList.children.length > 8) {
        historyList.removeChild(historyList.lastChild);
    }
}

updateBalance();

</script>

</body>
 </html>
