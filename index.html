<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GTFS FOREX</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b12;
    color:#e8edf7;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    height:64px;
    background:#0d111a;
    border-bottom:1px solid #202634;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#35d39a;
}

.market-name{
    color:#8993a7;
    font-size:13px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
}

.card{
    background:#0d111a;
    border:1px solid #202634;
    border-radius:10px;
    padding:14px;
}

.price{
    font-size:30px;
    font-weight:bold;
}

.green{
    color:#27d69a;
}

.red{
    color:#ff5263;
}

.stats{
    display:flex;
    gap:20px;
    margin-top:8px;
    font-size:12px;
    color:#8993a7;
}

.chart-card{
    background:#0d111a;
    border:1px solid #202634;
    border-radius:10px;
    overflow:hidden;
}

.chart-head{
    padding:12px;
    border-bottom:1px solid #202634;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.tabs button{
    background:none;
    color:#8993a7;
    border:0;
    padding:6px 10px;
    cursor:pointer;
}

.tabs button.active{
    color:white;
    background:#202634;
    border-radius:5px;
}

canvas{
    width:100%;
    height:430px;
    display:block;
}

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
}

.balance-row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    color:#9da6b8;
}

.balance-row strong{
    color:white;
}

.order-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:12px;
    background:#080b12;
    color:white;
    border:1px solid #2a3242;
    border-radius:6px;
    outline:none;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    gap:8px;
}

button.order{
    flex:1;
    border:0;
    padding:12px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.buy{
    background:#18b982;
    color:white;
}

.sell{
    background:#e94d60;
    color:white;
}

.orders{
    margin-top:12px;
}

.trade{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #202634;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#566074;
    font-size:11px;
    padding:20px;
}

@media(max-width:700px){

    .top,
    .bottom{
        grid-template-columns:1fr;
    }

    canvas{
        height:330px;
    }

    .price{
        font-size:25px;
    }

    .stats{
        gap:10px;
        flex-wrap:wrap;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        💎 <span>GTFS</span> EXCHANGE
    </div>

    <div class="market-name">
        DL/IDR
    </div>

</header>


<div class="container">

    <!-- PRICE -->

    <div class="top">

        <div class="card">

            <div style="font-size:12px;color:#8993a7">
                DIAMOND LOCK / IDR
            </div>

            <div class="price" id="price">
                Rp50.000
            </div>

            <div id="change" class="green">
                +0.00%
            </div>

            <div class="stats">

                <div>
                    HIGH
                    <strong id="high">Rp50.000</strong>
                </div>

                <div>
                    LOW
                    <strong id="low">Rp50.000</strong>
                </div>

                <div>
                    VOLUME
                    <strong id="volume">0 DL</strong>
                </div>

            </div>

        </div>


        <div class="card">

            <div style="font-size:12px;color:#8993a7">
                MARKET STATUS
            </div>

            <div style="font-size:22px;margin-top:7px;color:#27d69a">
                ● OPEN
            </div>

            <div style="font-size:12px;color:#8993a7;margin-top:7px">
                Virtual GTFS Market
            </div>

        </div>

    </div>


    <!-- CHART -->

    <div class="chart-card">

        <div class="chart-head">

            <strong>DL / IDR</strong>

            <div class="tabs">

                <button class="active" onclick="setTimeframe(1,this)">
                    1m
                </button>

                <button onclick="setTimeframe(5,this)">
                    5m
                </button>

                <button onclick="setTimeframe(15,this)">
                    15m
                </button>

            </div>

        </div>

        <canvas id="chart"></canvas>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <!-- BALANCE -->

        <div class="card">

            <div class="order-title">
                WALLET
            </div>

            <div class="balance-row">
                <span>💎 Diamond Lock</span>
                <strong id="dlBalance">100 DL</strong>
            </div>

            <div class="balance-row">
                <span>🇮🇩 IDR</span>
                <strong id="idrBalance">Rp5.000.000</strong>
            </div>

        </div>


        <!-- ORDER -->

        <div class="card">

            <div class="order-title">
                MARKET ORDER
            </div>

            <input
                id="amount"
                type="number"
                min="1"
                value="1"
                placeholder="Jumlah DL">

            <div class="buttons">

                <button
                    class="order buy"
                    onclick="buyDL()">
                    BUY
                </button>

                <button
                    class="order sell"
                    onclick="sellDL()">
                    SELL
                </button>

            </div>

        </div>

    </div>


    <!-- HISTORY -->

    <div class="card orders">

        <div class="order-title">
            RECENT TRADES
        </div>

        <div id="trades">

            <div class="trade">
                <span>BUY</span>
                <span>1 DL</span>
                <span>Rp50.000</span>
            </div>

        </div>

    </div>

</div>


<div class="footer">
    GTFS Exchange • Virtual Market • For Fun
</div>


<script>

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let price = 50000;

let openingPrice = 50000;

let high = price;

let low = price;

let volume = 0;

let dlBalance = 100;

let idrBalance = 5000000;

let timeframe = 1;

let candles = [];

let currentCandle = null;


/* =========================
   FORMAT
========================= */

function rupiah(value){

    return "Rp" + Math.round(value)
        .toLocaleString("id-ID");

}


/* =========================
   CREATE CANDLE
========================= */

function newCandle(){

    currentCandle = {

        open: price,

        high: price,

        low: price,

        close: price,

        volume: Math.floor(
            Math.random()*50
        )

    };

    candles.push(currentCandle);

    if(candles.length > 50){

        candles.shift();

    }

}


/* =========================
   PRICE ENGINE
========================= */

function updateMarket(){

    /*
       Simulasi market.

       Random kecil + momentum
       membuat pergerakan terlihat
       lebih natural.
    */

    let movement =
        (Math.random()-0.48)
        * price
        * 0.0025;


    price += movement;


    if(price < 1000){

        price = 1000;

    }


    currentCandle.close = price;

    currentCandle.high =
        Math.max(
            currentCandle.high,
            price
        );

    currentCandle.low =
        Math.min(
            currentCandle.low,
            price
        );


    high = Math.max(high,price);

    low = Math.min(low,price);

    volume +=
        Math.floor(Math.random()*10);


    updateUI();

    drawChart();

}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById("price")
        .textContent = rupiah(price);


    let change =
        ((price-openingPrice)
        /openingPrice)*100;


    const changeEl =
        document.getElementById("change");


    changeEl.textContent =
        (change >= 0 ? "+" : "")
        + change.toFixed(2)
        + "%";


    changeEl.className =
        change >= 0
        ? "green"
        : "red";


    document.getElementById("high")
        .textContent = rupiah(high);


    document.getElementById("low")
        .textContent = rupiah(low);


    document.getElementById("volume")
        .textContent =
        volume.toLocaleString("id-ID")
        + " DL";


    document.getElementById("dlBalance")
        .textContent =
        dlBalance.toFixed(2)
        + " DL";


    document.getElementById("idrBalance")
        .textContent =
        rupiah(idrBalance);

}


/* =========================
   CHART
========================= */

function resizeCanvas(){

    canvas.width =
        canvas.clientWidth *
        window.devicePixelRatio;

    canvas.height =
        canvas.clientHeight *
        window.devicePixelRatio;

    ctx.scale(
        window.devicePixelRatio,
        window.devicePixelRatio
    );

    drawChart();

}


function drawChart(){

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(candles.length === 0)
        return;


    let min =
        Math.min(
            ...candles.map(c=>c.low)
        );

    let max =
        Math.max(
            ...candles.map(c=>c.high)
        );


    let range = max-min;

    if(range === 0)
        range = 1;


    /*
       Grid
    */

    ctx.strokeStyle =
        "#171d28";

    ctx.lineWidth = 1;


    for(let i=0;i<6;i++){

        let y =
            (height/5)*i;

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(width,y);

        ctx.stroke();

    }


    let candleWidth =
        Math.max(
            5,
            width/candles.length*0.65
        );


    candles.forEach((c,i)=>{

        let x =
            i *
            (width/candles.length)
            +
            (width/candles.length)/2;


        function y(value){

            return height -
                ((value-min)/range)
                *height*0.88
                -20;

        }


        let openY =
            y(c.open);

        let closeY =
            y(c.close);

        let highY =
            y(c.high);

        let lowY =
            y(c.low);


        let bullish =
            c.close >= c.open;


        ctx.strokeStyle =
            bullish
            ? "#27d69a"
            : "#ff5263";


        ctx.fillStyle =
            bullish
            ? "#27d69a"
            : "#ff5263";


        /*
           Wick
        */

        ctx.beginPath();

        ctx.moveTo(x,highY);

        ctx.lineTo(x,lowY);

        ctx.stroke();


        /*
           Body
        */

        let bodyTop =
            Math.min(
                openY,
                closeY
            );

        let bodyHeight =
            Math.max(
                2,
                Math.abs(
                    closeY-openY
                )
            );


        ctx.fillRect(
            x-candleWidth/2,
            bodyTop,
            candleWidth,
            bodyHeight
        );

    });


    /*
       Current price line
    */

    let lastY =
        height -
        ((price-min)/range)
        *height*0.88
        -20;


    ctx.setLineDash([5,5]);

    ctx.strokeStyle =
        "#7b879d";

    ctx.beginPath();

    ctx.moveTo(0,lastY);

    ctx.lineTo(width,lastY);

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.fillStyle =
        "#e8edf7";

    ctx.font =
        "12px Arial";

    ctx.fillText(
        rupiah(price),
        width-90,
        lastY-6
    );

}


/* =========================
   BUY
========================= */

function buyDL(){

    let amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    if(amount <= 0)
        return;


    let cost =
        amount*price;


    if(idrBalance < cost){

        alert(
            "Saldo IDR tidak cukup!"
        );

        return;

    }


    idrBalance -= cost;

    dlBalance += amount;

    volume += amount;


    addTrade(
        "BUY",
        amount,
        price
    );


    updateUI();

}


/* =========================
   SELL
========================= */

function sellDL(){

    let amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    if(amount <= 0)
        return;


    if(dlBalance < amount){

        alert(
            "Diamond Lock tidak cukup!"
        );

        return;

    }


    let value =
        amount*price;


    dlBalance -= amount;

    idrBalance += value;

    volume += amount;


    addTrade(
        "SELL",
        amount,
        price
    );


    updateUI();

}


/* =========================
   HISTORY
========================= */

function addTrade(
    type,
    amount,
    tradePrice
){

    let div =
        document.createElement(
            "div"
        );


    div.className = "trade";


    div.innerHTML = `

        <span class="${
            type==="BUY"
            ? "green"
            : "red"
        }">
            ${type}
        </span>

        <span>
            ${amount} DL
        </span>

        <span>
            ${rupiah(tradePrice)}
        </span>

    `;


    document
        .getElementById("trades")
        .prepend(div);


    if(
        document
        .getElementById("trades")
        .children.length > 8
    ){

        document
        .getElementById("trades")
        .lastChild
        .remove();

    }

}


/* =========================
   TIMEFRAME
========================= */

function setTimeframe(
    value,
    button
){

    timeframe = value;


    document
        .querySelectorAll(
            ".tabs button"
        )
        .forEach(
            b=>b.classList.remove(
                "active"
            )
        );


    button.classList.add(
        "active"
    );

}


/* =========================
   START
========================= */

newCandle();


for(let i=0;i<45;i++){

    price +=
        (Math.random()-0.48)
        *price*0.003;

    newCandle();

}


price = 50000;

updateUI();

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/*
   Update setiap 1 detik
*/

setInterval(
    updateMarket,
    1000
);


/*
   Candle baru setiap 10 detik
   untuk simulasi timeframe.
*/

setInterval(
    newCandle,
    10000
);

</script>

</body>
</html>
